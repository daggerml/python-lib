name: CI
on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        py: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest]
        exclude:
          # Only test the first and latest stable Pythons on macOS to keep CI fast
          # - os: macos-latest
          #   py: "3.11"
          - os: macos-latest
            py: "3.12"
          - os: macos-latest
            py: "3.13"
          # - os: macos-latest
          #   py: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history
          fetch-tags: true # redundant in v4, but explicit
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}
      - name: Install uv
        run: pip install uv==0.11.7
      - name: Sync dependencies
        run: uv sync --group dev --all-extras
      - name: Full deterministic suite (without Docker)
        run: uv run pytest -m 'not docker and not ssh and not external' .
      - name: Report external acceptance (not executed without credentials)
        run: uv run pytest --collect-only -q -m external tests/external/
  docker-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.7
      - name: Sync dependencies
        run: uv sync --group dev --all-extras
      - name: Build worker image
        run: docker build -t daggerml-lifecycle:ci -f docs/Dockerfile .
      - name: Docker lifecycle results
        env:
          LIFECYCLE_DOCKER_IMAGE: daggerml-lifecycle:ci
        run: uv run pytest -m 'docker and not external' tests/contrib/integration/
  ssh-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.7
      - name: Install local OpenSSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          sudo usermod --password "$(openssl passwd -6 "$(openssl rand -hex 32)")" "$(id -un)"
      - name: Sync dependencies
        run: uv sync --group dev --all-extras
      - name: Local SSH lifecycle results
        run: uv run pytest -m 'ssh and not external' tests/contrib/integration/
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.7
      - name: Build with ASAN + UBSAN
        env:
          CMAKE_ARGS: "-DDML_ENABLE_ASAN=ON -DDML_ENABLE_UBSAN=ON"
        run: uv sync --group dev --all-extras
      - name: Run tests with sanitizers
        env:
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          LIBASAN=$(gcc -print-file-name=libasan.so)
          LD_PRELOAD="$LIBASAN" uv run pytest -m 'not docker and not ssh and not external' .
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.7
      - name: Sync dependencies
        run: uv sync --group dev --all-extras
      - name: Run Ruff
        run: uv run ruff check --output-format=github .
      - name: Run Pyright
        run: uv run pyright --project .
  dashboard:
    if: >-
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json
      - name: Build verified dashboard assets
        env:
          DOCS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: bash ./docs/build.sh
      - name: Upload verified dashboard assets
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-assets
          path: src/daggerml/dashboard/static/
          if-no-files-found: error
          retention-days: 1
  build-wheels:
    needs: dashboard
    if: >-
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        python:
          - version: "3.11"
            identifier: cp311
          - version: "3.12"
            identifier: cp312
          - version: "3.13"
            identifier: cp313
          - version: "3.14"
            identifier: cp314
        platform:
          - id: linux
            os: ubuntu-latest
          - id: macos
            os: macos-latest
    # name: Build Python ${{ matrix.python.version }} wheel for ${{ matrix.platform.id }}
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download verified dashboard assets
        uses: actions/download-artifact@v8
        with:
          name: dashboard-assets
          path: src/daggerml/dashboard/static/
      - name: Build wheel
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: "${{ matrix.python.identifier }}-*"
          CIBW_ARCHS: auto
          CIBW_TEST_EXTRAS: dashboard
          CIBW_TEST_REQUIRES: httpx
          CIBW_TEST_COMMAND: python -I {project}/tests/distribution/check_installed_docs.py
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform.id }}-${{ matrix.python.identifier }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1
  build-sdist:
    needs: dashboard
    if: >-
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download verified dashboard assets
        uses: actions/download-artifact@v8
        with:
          name: dashboard-assets
          path: src/daggerml/dashboard/static/
      - name: Build source distribution
        run: |
          pip install hatch
          hatch build --target sdist
      - name: Check installed sdist-derived wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/sdist-wheel" dist/*.tar.gz
          python -m venv "$RUNNER_TEMP/sdist-docs"
          "$RUNNER_TEMP/sdist-docs/bin/python" -m pip install "$RUNNER_TEMP"/sdist-wheel/*.whl
          "$RUNNER_TEMP/sdist-docs/bin/python" -m pip install 'daggerml[dashboard]' httpx
          "$RUNNER_TEMP/sdist-docs/bin/python" -I tests/distribution/check_installed_docs.py
      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1
  publish:
    needs:
      ["test", "lint", "sanitize", "ssh-lifecycle", "docker-lifecycle", "dashboard", "build-wheels", "build-sdist"]
    if: startsWith(github.ref, 'refs/tags/v')
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.13-publish-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.13-
            ${{ runner.os }}-pip-
      - name: Install hatch
        run: |
          pip install hatch
      - name: Publish distributions
        env:
          HATCH_INDEX_USER: __token__
          HATCH_INDEX_AUTH: ${{ secrets.PYPI_TOKEN }}
        run: hatch publish
