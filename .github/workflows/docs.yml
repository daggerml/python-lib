name: Docs

on:
  workflow_run:
    workflows: [Test]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    environment:
      name: github-pages
      url: https://daggerml.com/
    steps:
      - name: Download tested release ref
        uses: actions/download-artifact@v8
        with:
          name: release-ref-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify tested release tag
        env:
          TESTED_TAG: ${{ github.event.workflow_run.head_branch }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$TESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(< "$RUNNER_TEMP/release/release-ref")" == "refs/tags/$TESTED_TAG" ]]
          [[ "$(git rev-parse "refs/tags/$TESTED_TAG^{commit}")" == "$TESTED_SHA" ]]
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json
      - name: Build executable documentation and standalone site
        env:
          DOCS_SITE_OUTPUT: ${{ github.workspace }}/.tools/pages
        run: bash docs/build.sh
      - name: Replace organization website
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
          external_repository: daggerml/daggerml.github.io
          publish_branch: gh-pages
          publish_dir: .tools/pages
          keep_files: false
          cname: daggerml.com
