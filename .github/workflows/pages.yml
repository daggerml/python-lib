name: Docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  push:
    branches:
      - pages-and-workflows

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    # if: >-
    #   github.event.workflow_run.conclusion == 'success' &&
    #   github.event.workflow_run.event == 'push' &&
    #   github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json
      - name: Build executable documentation and standalone site
        env:
          DOCS_SITE_OUTPUT: ${{ github.workspace }}/.tools/pages
        run: bash docs/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .tools/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
