name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        py: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest]
        exclude:
          # Only test the first and latest stable Pythons on macOS to keep CI fast
          # - os: macos-latest
          #   py: "3.11"
          - os: macos-latest
            py: "3.12"
          - os: macos-latest
            py: "3.13"
          # - os: macos-latest
          #   py: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history
          fetch-tags: true # redundant in v4, but explicit
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}
      - name: Install uv
        run: pip install uv==0.11.7
      - name: Sync dependencies
        run: uv sync --group dev --all-extras
      - name: Full deterministic suite (without Docker)
        run: uv run pytest -m 'not dashboard and not docker and not ssh and not external' .
      - name: Report external acceptance (not executed without credentials)
        run: uv run pytest --collect-only -q -m external tests/external/
  docker-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.7
      - name: Sync dependencies
        run: uv sync --group dev --all-extras
      - name: Build worker image
        run: docker build -t daggerml-lifecycle:ci -f docs/Dockerfile .
      - name: Docker lifecycle results
        env:
          LIFECYCLE_DOCKER_IMAGE: daggerml-lifecycle:ci
        run: uv run pytest -m 'docker and not external' tests/contrib/integration/
  ssh-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.7
      - name: Install local OpenSSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          sudo usermod --password "$(openssl passwd -6 "$(openssl rand -hex 32)")" "$(id -un)"
      - name: Sync dependencies
        run: uv sync --group dev --all-extras
      - name: Local SSH lifecycle results
        run: uv run pytest -m 'ssh and not external' tests/contrib/integration/
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.7
      - name: Build with ASAN + UBSAN
        env:
          CMAKE_ARGS: "-DDML_ENABLE_ASAN=ON -DDML_ENABLE_UBSAN=ON"
        run: uv sync --group dev --all-extras
      - name: Run tests with sanitizers
        env:
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          LIBASAN=$(gcc -print-file-name=libasan.so)
          LD_PRELOAD="$LIBASAN" uv run pytest -m 'not dashboard and not docker and not ssh and not external' .
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.7
      - name: Sync dependencies
        run: uv sync --group dev --all-extras
      - name: Run Ruff
        run: uv run ruff check --output-format=github .
      - name: Run Pyright
        run: uv run pyright --project .
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json
      - name: Build verified dashboard assets
        env:
          DOCS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: bash ./docs/build.sh
      - name: Dashboard Python tests
        run: uv run pytest -m 'dashboard and not docker and not ssh and not external' .
      - name: Upload verified dashboard assets
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-assets-${{ github.run_attempt }}
          path: src/daggerml/dashboard/static/
          if-no-files-found: error
          retention-days: 2
  release-ref:
    needs: [test, lint, sanitize, ssh-lifecycle, docker-lifecycle, dashboard]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Record the tested tag ref
        run: printf '%s\n' "$GITHUB_REF" > "$RUNNER_TEMP/release-ref"
      - name: Upload release ref
        uses: actions/upload-artifact@v7
        with:
          name: release-ref-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-ref
          if-no-files-found: error
          retention-days: 2
