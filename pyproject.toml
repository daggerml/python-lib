[build-system]
requires = ["scikit-build-core>=0.11", "setuptools-scm>=8", "Cython>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "daggerml"
dynamic = ["version"]
authors = [
  { name="DaggerML", email="engineering@daggerml.com" }
]
description = "DaggerML"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = []
classifiers = [
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "typing-extensions>=4.0.0; python_version < '3.11'",
  "boto3",
]

[project.optional-dependencies]
table = [
  "tabulate",
  "asciidag",
]
[project.scripts]
dml = "daggerml._cli:cli"
dml-local-adapter = "daggerml.contrib.adapters:LocalAdapter.cli"
dml-lambda-adapter = "daggerml.contrib.adapters:LambdaAdapter.cli"

[project.entry-points."daggerml.contrib.adapters"]
local = "daggerml.contrib.adapters:LocalAdapter"
lambda = "daggerml.contrib.adapters:LambdaAdapter"

[project.entry-points."daggerml.contrib.executors"]
batch = "daggerml.contrib.executors:BatchExecutor"
script = "daggerml.contrib.executors:ScriptExecutor"
docker = "daggerml.contrib.executors:DockerExecutor"
ssh = "daggerml.contrib.executors:SshExecutor"
cfn = "daggerml.contrib.executors:CfnExecutor"

[project.entry-points."daggerml.codecs"]
dataframe = "daggerml.contrib.codecs:literal_codecs"

[project.urls]
Homepage = "https://daggerml.com"
Documentation = "https://daggerml.com"
Issues = "https://github.com/daggerml/python-lib/issues"
Source = "https://github.com/daggerml/python-lib"
License = "https://github.com/daggerml/python-lib/blob/master/LICENSE"

[tool.scikit-build]
wheel.packages = ["src/daggerml"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["src/daggerml/__about__.py"]

[tool.setuptools_scm]
write_to = "src/daggerml/__about__.py"
tag_regex = "^v(?P<version>[0-9]+(?:\\.[0-9]+)*[a-zA-Z0-9\\.\\-]*)$"

[[tool.scikit-build.generate]]
path = "daggerml/__about__.py"
location = "install"
template = "__version__ = \"${version}\"\n"

[tool.pytest.ini_options]
pythonpath = "tests/"
minversion = "6.0"
addopts = "-ra"
testpaths = [
  "tests",
  "src/daggerml",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "serial",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I", "PGH004", "W"]
ignore = []
unfixable = ["B"]

[tool.ruff.lint.isort]
known-first-party = ["daggerml"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"src/daggerml/__init__.py" = ["F401", "E402"]
"src/daggerml/_internal/__init__.py" = ["F401", "E402"]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.coverage.run]
source_pkgs = ["daggerml"]
branch = true
parallel = true
omit = [
  "src/daggerml/__init__.py",
]

[tool.coverage.paths]
daggerml = ["src/daggerml", "*/python-lib/src/daggerml"]
tests = ["tests", "*/python-lib/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.pyright]
include = ["src"]
defineConstant = { DEBUG = true }
typeCheckingMode = "basic"
reportGeneralTypeIssues = false
reportMissingImports = "error"
reportMissingModuleSource = false
reportMissingTypeStubs = false
reportOptionalCall = false
reportOptionalMemberAccess = false

[dependency-groups]
dev = [
    "hypothesis>=6.141.1",
    "moto[all,server]>=5.1.20",
    "polars>=1.39.0",
    "pyright>=1.1.409",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]
